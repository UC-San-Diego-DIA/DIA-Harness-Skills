name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository
        shell: pwsh
        run: .\scripts\validate-repository.ps1

      - name: Test installer
        shell: pwsh
        run: .\scripts\test-install-skill.ps1
