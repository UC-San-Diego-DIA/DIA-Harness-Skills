name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository
        shell: pwsh
        run: .\scripts\validate-repository.ps1

      - name: Test installer
        shell: pwsh
        run: .\scripts\test-install-skill.ps1

      - name: Test project-folder helper
        shell: pwsh
        run: .\scripts\test-setup-project-folder.ps1

      - name: Install DuckDB test dependency
        shell: pwsh
        run: python -m pip install "duckdb>=1.4,<2" "pytz>=2024.1"

      - name: Test DuckDB analysis helper
        shell: pwsh
        run: .\scripts\test-analyze-csv-with-duckdb.ps1 -Python python
