name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository
        shell: pwsh
        run: .\scripts\validate-repository.ps1

      - name: Test installer
        shell: pwsh
        run: .\scripts\test-install-skill.ps1

      - name: Test business-insights folder helper
        shell: pwsh
        run: .\scripts\test-setup-business-insights-folder.ps1

      - name: Test simple-workspace helper
        shell: pwsh
        run: .\scripts\test-create-simple-workspace.ps1

      - name: Test workspace helper
        shell: pwsh
        run: .\scripts\test-create-workspace.ps1

      - name: Test workspace starting-file moves
        shell: pwsh
        run: .\scripts\test-workspace-file-moves.ps1

      - name: Test combined workspace setup
        shell: pwsh
        run: .\scripts\test-combined-workspace.ps1

      - name: Test data-model intake helper
        shell: pwsh
        run: .\scripts\test-data-model-intake.ps1 -Python python

      - name: Install DuckDB test dependency
        shell: pwsh
        run: python -m pip install "duckdb>=1.4,<2" "pytz>=2024.1"

      - name: Test DuckDB analysis helper
        shell: pwsh
        run: .\scripts\test-analyze-local-data.ps1 -Python python

      - name: Test dataset-profile helper
        shell: pwsh
        run: .\scripts\test-dataset-profile.ps1 -Python python

      - name: Test workbook-intake helper
        shell: pwsh
        run: .\scripts\test-workbook-intake.ps1 -Python python

      - name: Test Tableau field metadata and standalone dictionary installation
        shell: pwsh
        run: python .\scripts\test_tableau_field_metadata.py

      - name: Test Tableau model extraction
        shell: pwsh
        run: python .\scripts\test_tableau_model_structure.py

      - name: Test Tableau business glossary
        shell: pwsh
        run: python .\scripts\test_tableau_glossary.py

      - name: Test Tableau metric and question proposals
        shell: pwsh
        run: python .\scripts\test_tableau_proposals.py

      - name: Test Dataset Intelligence Pack integration and installation
        shell: pwsh
        run: python .\scripts\test_tableau_pack.py
